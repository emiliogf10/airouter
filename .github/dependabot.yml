# ==============================================================================
# Configuración de Dependabot — AI Cost Router (DevSecOps)
# ==============================================================================
# Vigila automáticamente vulnerabilidades de seguridad (CVEs) y actualizaciones
# de dependencias en los tres ecosistemas del proyecto:
#   1. Backend Java / Spring Boot (Maven en /airouter)
#   2. Frontend Dashboard React / Vite (npm en /frontend)
#   3. Pipelines de Integración Continua (GitHub Actions en /)
# ==============================================================================

version: 2

updates:
  # ----------------------------------------------------------------------------
  # 1. Ecosistema Backend: Maven (Java 21 / Spring Boot / Flyway)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/airouter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "security"

  # ----------------------------------------------------------------------------
  # 2. Ecosistema Frontend: npm (React 19 / Vite / Tailwind v4 / Vitest)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    # Agrupar vite y sus plugins para evitar conflictos de peerDependencies (ERESOLVE)
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@testing-library/*"
    # Ignorar saltos de versión mayor (Major Breaking Changes) aislados en vite y vitest
    # que rompen peerDependencies con @vitejs/plugin-react y los tipos de @testing-library/jest-dom
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # ----------------------------------------------------------------------------
  # 3. Ecosistema CI/CD: GitHub Actions (Workflows en /.github/workflows)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci-cd"
      - "security"
