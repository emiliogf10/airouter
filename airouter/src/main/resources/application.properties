spring.application.name=airouter

# Configuracion de Base de Datos H2 en memoria (Desarrollo)
spring.datasource.url=jdbc:h2:mem:airouterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de JPA / Hibernate (solo validacion estricta del esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracion de Seguridad (Rate Limiting y CORS)
airouter.security.rate-limit.requests-per-minute=20
airouter.security.cors.allowed-origins=http://localhost:5173

