# =============================================================================
# Perfil de Produccion / Contenedores Docker (Perfil: prod)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/airouterdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:airouter_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:airouter_secret_pwd}

# Deshabilita por completo la consola administrativa H2 y trazas SQL en produccion ([NV-01])
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway sobre PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad CORS y Rate Limiting parametrizables por entorno
airouter.security.rate-limit.requests-per-minute=${AIROUTER_RATE_LIMIT_RPM:20}
airouter.security.cors.allowed-origins=${AIROUTER_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}
airouter.gemini.api-key=${GEMINI_API_KEY:}
