# =============================================================================
# Configuración de Nginx — Servidor SPA React 19 + Reverse Proxy API + Hardening
# =============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de endurecimiento de seguridad HTTP (DevSecOps)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy reverso hacia el Backend Spring Boot en la red interna Docker
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Soporte de enrutamiento SPA (Single Page Application) para React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
